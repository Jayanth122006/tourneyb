spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=${PORT:8081}

# Mailtrap SMTP Configuration (Synced with Railway Vars)
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

cashfree.appId=${CASHFREE_APP_ID}
cashfree.secretKey=${CASHFREE_SECRET_KEY}

# Mailtrap API (kept for reference)
mailtrap.token=${MAILTRAP_TOKEN}
mailtrap.inboxId=${MAILTRAP_INBOX_ID}